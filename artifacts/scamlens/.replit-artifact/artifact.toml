kind = "web"
previewPath = "/"
title = "ScamLens"
description = "An adaptive phishing-awareness training app that helps users practice realistic simulations, learn from explainable coaching, and measure improvement."
version = "1.0.0"
id = "artifacts/scamlens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18693

[services.development]
run = "pnpm --filter @workspace/scamlens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scamlens", "run", "build" ]
serve = "static"
publicDir = "artifacts/scamlens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18693"
BASE_PATH = "/"
